# Prompts for the site illustrations.
#
# Edit a `subject` (or the shared `style`), then regenerate just that image:
#   python3 scripts/generate_illustrations.py hope
# Regenerate everything:
#   python3 scripts/generate_illustrations.py all
#
# The final prompt sent is "<subject>, <style>", extending the CISAI brand
# guide's formula: "[subject], futuristic, solarpunk, hopeful, illustration
# in the style of moebius".
#
# Where the style comes from. The `style` block below is CISAI's illustration
# influences distilled into prompt language: Moebius line, Lutohin's biomorphic
# retro-futurism, Daniel Martin Diaz's annotated schematic plate, Colorpong's
# network geometry, and the spot-colour flatness of a Simon Berndt screenprint.
# Artists are described here, never uploaded — see the `references` note below.
# (Website and interface references are a separate list, kept in
# DESIGN-REFERENCES.md in the website repo. Never feed those to the generator.)
#
# Style references: every image in the `references` folder is sent with
# every prompt (PNG, JPG or WebP; 16 images max in total). Keep this folder
# to images CISAI owns — its own illustrations and approved outputs. Other
# artists' work belongs in words in `style`, not uploaded here. Keep the set
# stylistically consistent; mixed styles dilute the result.
#
# Per-image fields:
#   subject     what to draw (the part you'll usually edit)
#   alt         alt text; the script writes it into index.html
#   resize      optional [width, height] applied after generation
#   crop        true trims the image to its drawn subject
#   references  optional list of extra image paths sent for this image only,
#               e.g. a photo of the real skyline to guide the layout

model: gpt-image-2
size: 1536x1024
quality: high
references: assets/brand/style-references

style: >-
  futuristic, solarpunk, hopeful, illustration in the style of moebius, drawn
  as a retro-futurist technical plate. Clean unvarying ink contour with no
  hatching, flat cel shading, and the limited spot-colour flatness of a
  screenprint: warm peach, sand and periwinkle blue with small touches of deep
  red and green. Build the subject the way a 1970s cutaway diagram would —
  measured rule lines, node-and-network geometry, instrument faces and exposed
  structure, and a few slender leader lines that each resolve into a small
  hexagonal inset vignette drawing a detail of the structure in close-up; never
  leave a leader line trailing into empty space — while
  keeping the forms biomorphic and hand-drawn rather than mechanical. Match
  the reference images in linework and palette, and take only their drawing
  style, not their subjects or composition. Isolated subject on a plain pure
  white background, no ground plane, no sky, no text, no lettering, no
  numerals, no border.

images:
  hero:
    # Generated by Leo outside this script (Nov 2026; current source file
    # floating-island-hovering-sky-table--d28788.png, 2560x1536 RGB on white,
    # replacing the earlier --c23b7b medallion version). The subject below is
    # the base prompt plus the four-inset clause drafted for it; Leo's exact
    # wording may differ. The result has four rounded-rectangle panels
    # (dome, networked globe, dancers under a tree, telescope at dawn), each
    # with a leader line, and no dome over the island itself.
    # White background keyed to transparent, trimmed, 1600px wide.
    subject: >-
      a floating island hovering in the sky with table mountain at its centre,
      a solarpunk Cape Town village of domed buildings, gardens and solar
      canopies, the whole settlement protected by a delicate translucent dome
      made of a hexagonal lattice, the presence of water, warm colours.
      Exactly four slender leader lines run from the island to four small
      hexagonal inset vignettes, two on each side, and each hexagon contains
      one of the four attached track images, reproduced small and faithfully
      inside its hexagonal frame: the hexagonal energy-field shield, with its
      leader line touching the dome; the networked globe, touching the solar
      canopies; the ring of dancers, touching a garden square in the village;
      and the dawn telescope view, touching a small observatory on the summit
      of table mountain. Every leader line ends in its hexagon; never leave
      one trailing into empty space. Use the attached track images only
      inside the hexagons; do not restyle the island, dome or village after
      them
    alt: A floating island with Table Mountain at its centre and a solarpunk Cape Town village, with leader lines out to four round medallions showing the track images; a hexagonal shield, a networked globe, a ring of dancers, and a dawn seen through a telescope
    crop: true

  # All four track images now use Leo's cutout prompt format; the full
  # prompt is in each subject. (Before Nov 2026 they used image-to-image
  # passes and a shared track style: flat colour blocking,
  # crisp hard boundaries, stepped tones, the palette cornflower #6495ED /
  # misty blue #BCD4E6 / light salmon #FFA07A / coral red #FF4040, and Tuco
  # Amalfi's radiant light and sacred geometry rendered as posterised flat
  # colour.) The shared `style` block below describes the hero.

  resilience:
    # Leo's prompt (Nov 2026), generated in his own tool (source file
    # hexagonal-energy-field-shield--d57989.png, 2560x2560 RGBA cutout). Placed at 660px tall on a
    # transparent 1080x720 canvas.
    subject: >-
      a detailed hexagonal energy-field shield, a honeycomb mesh of true
      six-sided hexagons with machined steel spheres at every vertex and
      edges drawn as sparkling blue energy conduits, a fainter finer
      lattice behind, concentric hexagonal rings stepping from a warm
      light salmon centre out through misty blue to cornflower,
      flower-of-life construction lines over the mesh, isolated on pure
      white for a cutout. Futuristic, solarpunk, hopeful, illustration
      in the style of moebius, drawn as a retro-futurist technical
      plate. Clean unvarying ink contour with no hatching, flat cel
      shading, and the limited spot-colour flatness of a screenprint.
      Accents of red. Isolated subject on a plain pure white background,
      no ground plane, no sky, no text, no lettering, no numerals, no
      border.
    alt: "A hexagonal energy-field shield: a honeycomb mesh of steel nodes and glowing blue conduits around a warm salmon centre"
    resize: [1080, 720]

  coordination:
    # Leo's prompt (Nov 2026), generated in his own tool (source file
    # detailed-globe-grid-lines-network--5a0831.png, 2560x2560 RGBA cutout). Placed at 660px tall on a
    # transparent 1080x720 canvas.
    subject: >-
      a detailed globe with grid lines and a network of arcs linking
      cities, oceans in stepped cornflower and misty blue, land in light
      salmon with sparkling white nodes, sacred-geometry construction
      lines over the sphere and a halo of three concentric stepped
      bands, isolated on pure white for a cutout. Futuristic, solarpunk,
      hopeful, illustration in the style of moebius, drawn as a
      retro-futurist technical plate. Clean unvarying ink contour with
      no hatching, flat cel shading, and the limited spot-colour
      flatness of a screenprint. Accents of red. Isolated subject on a
      plain pure white background, no ground plane, no sky, no text, no
      lettering, no numerals, no border.
    alt: "The Earth wrapped in a network of connections linking cities across the globe"
    resize: [1080, 720]

  empowerment:
    # Leo's final prompt (Nov 2026; source file
    # ring-six-dancers-after-matisse--3c2d61.png). The image came out with
    # five dancers. Placed at 660px tall on a transparent 1080x720 canvas.
    subject: >-
      a ring of six dancers after Matisse's Dance (1910), hands linked
      in a circle, bodies leaning and leaping with joyful movement,
      highly abstracted featureless silhouettes with no faces and
      absolutely no anatomical detail, the dancers alternating between
      solid flat cornflower figures and silvery iridescent figures,
      isolated on pure white for a cutout. Futuristic, solarpunk,
      hopeful, illustration in the style of moebius, drawn as a
      retro-futurist technical plate. Clean unvarying ink contour with
      no hatching, flat cel shading, and the limited spot-colour
      flatness of a screenprint. Accents of red, sparkling white, and
      cornflower blue in the iridescent figures. Isolated subject on a
      plain pure white background, no ground plane, no sky, no text, no
      lettering, no numerals, no border.
    alt: A ring of dancers after Matisse, hands linked, alternating solid blue figures and iridescent chrome figures
    resize: [1080, 720]

  hope:
    # Generated by Leo outside this script (Nov 2026; current source file
    # dawn-landscape-seen-through-telescope--d50f5c.png, 2560x2560 RGB on
    # white, all-steel eyepiece ring; it replaced --0e8b4a, which had a
    # cornflower enamel ring). The subject is the from-scratch prompt it was
    # based on; Leo's exact wording may differ. White background keyed to
    # transparent
    # (border-connected near-white only), then placed at 660px tall on a
    # transparent 1080x720 canvas.
    subject: >-
      a dawn landscape seen through a telescope: inside a perfect
      circle, a precisely cut faceted crystal hovering above calm
      rolling ground in stepped bands, exactly one sun low on the
      horizon to one side, its rays splitting into flat prism bands as
      they pass through the crystal, the crystal has no glow of its own,
      a few flower clusters in the foreground, concentric construction
      circles around the crystal, the circle framed by a detailed
      retro-futurist telescope eyepiece ring of machined steel and
      cornflower enamel with fine measured tick marks, crosshair marks
      at the four compass points and sparkling white glints on the rim,
      nothing outside the ring, isolated on pure white for a cutout.
      Futuristic, solarpunk, hopeful, illustration in the style of
      moebius, drawn as a retro-futurist technical plate. Clean
      unvarying ink contour with no hatching, flat cel shading, and the
      limited spot-colour flatness of a screenprint. Accents of red.
      Isolated subject on a plain pure white background, no ground plane
      or sky outside the ring, no text, no lettering, no numerals, no
      border.
    alt: "A dawn landscape seen through a telescope eyepiece: a faceted crystal hovering over rolling hills as the sun rises"
    resize: [1080, 720]

  dacc-hex:
    subject: >-
      a boy standing at a fork in the road with a bear labelled
      Deceleration behind him; the left path leads to Domination
      (centralized power), the right to Doom (existential risks, gray-zone
      war of all against all), and the centre to <d/acc> (avoid all three
      traps, secure bright future for humanity), full-bleed
    alt: A boy stands at a fork in the road with a bear, Deceleration, behind him. The left path leads to Domination (centralized power), the right to Doom (existential risks, gray-zone war of all against all), and the centre to <d/acc> (Avoid all three traps, secure bright future for humanity).
    resize: [1024, 1024]

  cape-town:
    subject: >-
      a solarpunk Cape Town of green buildings by the sea on real ground,
      Table Mountain and Lion's Head behind, full-bleed, warm colours
    alt: A solarpunk Cape Town of green buildings by the sea, with Table Mountain and Lion's Head behind
    resize: [1280, 720]
